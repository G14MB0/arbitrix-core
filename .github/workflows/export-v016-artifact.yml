name: export-v0.1.6-artifact

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - name: Build exact 0.1.6 distribution
        run: python -m build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ARBITRIX_CORE: "0.1.6"
      - name: Verify wheel metadata
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob('dist/arbitrix_core-0.1.6-*.whl')
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              metadata = next(name for name in zf.namelist() if name.endswith('.dist-info/METADATA'))
              text = zf.read(metadata).decode('utf-8')
          assert '\nVersion: 0.1.6\n' in text, text
          print(wheels[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arbitrix-core-v0.1.6-dist
          path: dist/
          if-no-files-found: error
